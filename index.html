<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/style.css">
    <script src="js/script.js" defer></script>
    <title>Loja de roupas</title>
</head>
<body>

    <header>
        <h1>👕Loja de roupas👚</h1>
    </header>

    <main class="carrossel">

        <div class="trilho">

            <div class="slide">
                <img src="img/camiseta.avif" alt="camiseta branca">
                <h2>Camiseta</h2>
                <p class="preco">R$ 49,90</p>
            </div>

            <div class="slide">
                <img src="img/calça.webp" alt="calça jeans">
                <h2>Calça</h2>
                <p class="preco">R$ 109,90</p>
            </div>

            <div class="slide">
                <img src="img/jaqueta.webp" alt="jaqueta preta">
                <h2>Jaqueta</h2>
                <p class="preco">R$ 179,90</p>
            </div>

            <div class="slide">
                <img src="img/vestido.webp" alt="vestido verde">
                <h2>Vestido</h2>
                <p class="preco">R$ 219,90</p>
            </div>

            <div class="slide">
                <img src="img/tenis.avif" alt="tenis preto">
                <h2>Tênis</h2>
                <p class="preco">R$ 299,90</p>

            </div>

        </div>
    </main>

    
    
</body>
</html>
